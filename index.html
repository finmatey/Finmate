<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FinMate – Hiểu dòng tiền, làm chủ tương lai</title>
  <meta name="description" content="Ứng dụng quản lý tài chính cá nhân cho học sinh bằng HTML, CSS và JavaScript thuần." />
  <meta name="theme-color" content="#183C35" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Điều hướng chính">
      <div>
        <div class="brand">
          <img src="icon.svg" alt="FinMate logo" />
          <span>FinMate</span>
        </div>
        <nav class="nav" id="nav-desktop">
          <button type="button" data-tab="home" aria-current="page">🏠 <span>Hôm nay</span></button>
          <button type="button" data-tab="tx">📋 <span>Giao dịch</span></button>
          <button type="button" data-tab="plan">🎯 <span>Kế hoạch</span></button>
          <button type="button" data-tab="rewards">🏆 <span>Thưởng</span></button>
          <button type="button" data-tab="assistant">✨ <span>Trợ lý AI</span></button>
          <button type="button" data-tab="settings">⚙️ <span>Cài đặt</span></button>
        </nav>
        <button type="button" class="btn primary block" data-act="add">+ Thêm giao dịch</button>
      </div>

      <div class="sidebar-foot">
        <div id="sidebar-user"></div>
        <button type="button" class="theme-btn" data-act="toggledark" id="theme-toggle-btn">
          <span>🌙 Chế độ Tối</span>
          <span id="theme-state">Tắt</span>
        </button>
      </div>
    </aside>

    <div class="stage">
      <header class="bar" id="bar"></header>
      <main id="view" aria-live="polite"></main>
    </div>

    <nav class="mobile-nav" id="nav-mobile" aria-label="Điều hướng di động">
      <button type="button" data-tab="home" aria-current="page">🏠<small>Hôm nay</small></button>
      <button type="button" data-tab="tx">📋<small>Giao dịch</small></button>
      <button type="button" data-tab="plan">🎯<small>Kế hoạch</small></button>
      <button type="button" data-tab="rewards">🏆<small>Thưởng</small></button>
      <button type="button" data-tab="assistant">✨<small>Trợ lý AI</small></button>
      <button type="button" data-tab="settings">⚙️<small>Cài đặt</small></button>
    </nav>
  </div>

  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" hidden></div>

  <script defer src="logic.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
